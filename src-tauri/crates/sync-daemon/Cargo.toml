[package]
name = "sync-daemon"
version = "1.0.5"
edition = "2021"
description = "Theorem LAN sync background daemon — runs independently of the GUI"

[[bin]]
name = "sync-daemon"
path = "src/main.rs"

[dependencies]
theorem-sync-core = { path = "../theorem-sync-core" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
