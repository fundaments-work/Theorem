[package]
name = "tauri-plugin-android-sync-worker"
version = "0.1.0"
description = "Android ForegroundService for Theorem background sync."
authors = ["Fundamentals"]
license = "MIT"
edition = "2021"
links = "tauri-plugin-android-sync-worker"
build = "build.rs"

[dependencies]
tauri = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2.4", features = ["build"] }
