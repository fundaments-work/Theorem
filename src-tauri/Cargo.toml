[package]
name = "theorem"
version = "1.0.0-8"
description = "Local-first reader for PDFs, EPUBs, and RSS with markdown export."
authors = ["Fundamentals"]
license = "MIT"
homepage = "https://github.com/sapienskid/theorem"
repository = "https://github.com/sapienskid/theorem"
edition = "2021"
default-run = "theorem"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "theorem_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
tauri-plugin-app = "2.0.0-alpha.1"
tauri-plugin-barcode-scanner = "2"
tauri-plugin-http = { version = "2", features = ["rustls-tls"] }
tauri-plugin-mobile-folder-scan = { path = "plugins/mobile-folder-scan" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", default-features = false, features = ["blocking", "json", "rustls-tls", "cookies", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }

# ── LAN Device Sync ──
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["compression-gzip", "decompression-gzip"] }
futures = "0.3"
local-ip-address = "0.6"

# Cryptography (RustCrypto, NCC Group audited)
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"

# QR code generation + encoding utilities
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
base64 = "0.22"
hex = "0.4"
bzip2 = "0.4"
tar = "0.4"
zip = "0.6"
walkdir = "2"
regex = "1.10.0"

# TTS engine (ONNX Runtime + Kokoro)
[target.'cfg(not(target_os = "android"))'.dependencies]
ort = "2.0.0-rc.12"
ndarray = "0.17.2"
kokoro-en = { version = "0.1.4", default-features = false, features = ["misaki-lean"] }

# Android: load ONNX Runtime dynamically from the bundled .so in jniLibs/
[target.'cfg(target_os = "android")'.dependencies]
ort = { version = "2.0.0-rc.12", default-features = false, features = ["load-dynamic", "ndarray"] }
ndarray = "0.17.2"
kokoro-en = { version = "0.1.4", default-features = false, features = ["misaki-lean"] }

# Optimize only the packages that need it in dev mode.
# debug-assertions = false removes the verbose #[cfg(debug_assertions)] eprintln!
# in kokoro-en's synthesizer.rs that prints every G2P phoneme string (2500+ chars
# per chunk) — without this, TTS in dev mode spends 90% of its time doing stderr I/O.
[profile.dev]
debug-assertions = false

# Only optimize the TTS pipeline packages — every other crate compiles at
# opt-level=0 which is 5-10× faster for incremental dev builds.
[profile.dev.package.kokoro-en]
opt-level = 3

[profile.dev.package.ort]
opt-level = 3

[profile.dev.package.ndarray]
opt-level = 3

[profile.dev.package.regex]
opt-level = 3
