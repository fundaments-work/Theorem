[workspace]
members = ["crates/theorem-sync-core", "crates/sync-daemon"]
resolver = "2"

[package]
name = "theorem"
version = "1.0.4"
description = "Local-first desktop reader for PDFs, EPUBs, MOBI, and RSS with neural TTS, highlights, vocabulary building, and Markdown export."
authors = ["Fundamentals"]
license = "MIT"
homepage = "https://github.com/sapienskid/theorem"
repository = "https://github.com/sapienskid/theorem"
edition = "2021"
default-run = "theorem"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "theorem_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
tauri-plugin-app = "2.0.0-alpha.1"
tauri-plugin-barcode-scanner = "2"
tauri-plugin-http = { version = "2", features = ["rustls-tls"] }
tauri-plugin-mobile-folder-scan = { path = "plugins/mobile-folder-scan" }
tauri-plugin-android-sync-worker = { path = "plugins/android-sync-worker" }
tauri-plugin-android-tts-audio = { path = "plugins/android-tts-audio" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", default-features = false, features = ["blocking", "json", "rustls-tls", "cookies", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }

# ── LAN Device Sync ──
theorem-sync-core = { path = "crates/theorem-sync-core" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "process"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["compression-gzip", "decompression-gzip"] }
futures = "0.3"
local-ip-address = "0.6"

# Cryptography (RustCrypto, NCC Group audited)
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"

# QR code generation + encoding utilities
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
base64 = "0.22"
hex = "0.4"
bzip2 = "0.4"
tar = "0.4"
zip = "0.6"
walkdir = "2"
regex = "1.10.0"

# EPUB pre-parser: streaming XML (replaces regex) + percent-encoded path fallback
quick-xml = "0.36"
percent-encoding = "2"

# TTS engine (ONNX Runtime + Kokoro)
[target.'cfg(not(target_os = "android"))'.dependencies]
unrar-ng = "0.7.7"
ndarray = "0.17.2"
kokoro-en = { version = "0.1.4", default-features = false, features = ["misaki-lean"] }
rodio = "0.22.2"

# Apple Silicon + Linux + Windows: ort default features (download-binaries has prebuilt binaries)
[target.'cfg(all(not(target_os = "android"), any(target_arch = "x86_64", target_arch = "aarch64"), not(target_vendor = "apple")))'.dependencies]
ort = "2.0.0-rc.12"

[target.aarch64-apple-darwin.dependencies]
ort = "2.0.0-rc.12"

# Intel Mac: no prebuilt binaries from download-binaries, use load-dynamic (provide dylib in CI)
[target.x86_64-apple-darwin.dependencies]
ort = { version = "2.0.0-rc.12", default-features = false, features = ["load-dynamic", "ndarray"] }

# Android: load ONNX Runtime dynamically from the bundled .so in jniLibs/
[target.'cfg(target_os = "android")'.dependencies]
ort = { version = "2.0.0-rc.12", default-features = false, features = ["load-dynamic", "ndarray"] }
ndarray = "0.17.2"
kokoro-en = { version = "0.1.4", default-features = false, features = ["misaki-lean"] }
jni = "0.21"

# Optimize only the packages that need it in dev mode.
# debug-assertions = false removes the verbose #[cfg(debug_assertions)] eprintln!
# in kokoro-en's synthesizer.rs that prints every G2P phoneme string (2500+ chars
# per chunk) — without this, TTS in dev mode spends 90% of its time doing stderr I/O.
[profile.dev]
debug-assertions = false

# Only optimize the TTS pipeline packages — every other crate compiles at
# opt-level=0 which is 5-10× faster for incremental dev builds.
[profile.dev.package.kokoro-en]
opt-level = 3

[profile.dev.package.ort]
opt-level = 3

[profile.dev.package.ndarray]
opt-level = 3

[profile.dev.package.regex]
opt-level = 3

# Optimize for release (reduces binary size significantly)
[profile.release]
opt-level = "s"      # Optimize for size
strip = true         # Strip symbols from binary
lto = true           # Enable Link Time Optimization
codegen-units = 1    # Maximize optimization (takes longer to compile)

